[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "megregore"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "fastapi>=0.128.0",
    "uvicorn>=0.30.0",
    "aiosqlite>=0.20.0",
    "sentence-transformers>=2.2.0",
    "chromadb>=0.4.0",
]

[tool.setuptools.packages.find]
include = ["megregore"]

[project.scripts]
megregore = "megregore.__main__:main"
